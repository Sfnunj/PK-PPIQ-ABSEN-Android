
name: Build APK PK PPIQ ABSEN

on:
  workflow_dispatch:
  push:
    paths:
      - 'PKPPIQ_CloudBuild.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

        

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q PKPPIQ_CloudBuild.zip -d source
          ROOT=$(find source -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$ROOT")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PK-PPIQ-ABSEN-debug
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
